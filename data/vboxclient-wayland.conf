# VBoxClient (the user unit generated from the vboxclient.desktop autostart entry of
# virtualbox-guest-utils) takes DISPLAY of Xwayland for an X11 session and runs the X11
# clipboard, which does not reach Wayland clients. Without DISPLAY it runs as a Wayland
# client and uses the data-control protocol of the compositor. Inert without VirtualBox:
# there is no such unit to drop into.
[Service]
UnsetEnvironment=DISPLAY
