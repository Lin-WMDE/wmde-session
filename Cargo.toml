[package]
name = "wmde-session"
description = "The session manager for the WMDE desktop environment"
version = "1.0.0"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.93"
authors = ["WMDE <https://wmde.fun>"]
publish = false

[dependencies]
color-eyre = "0.6"
futures-util = "0.3"
cosmic-dbus-a11y = { git = "https://github.com/pop-os/dbus-settings-bindings" }
freedesktop-desktop-entry = { version = "0.8", optional = true }
shell-words = { version = "1.1.1", optional = true }
dirs = { version = "6.0.0", optional = true }
launch-pad = { git = "https://github.com/pop-os/launch-pad" }
log-panics = { version = "2", features = ["with-backtrace"] }
rustix = "1.1"
scopeguard = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "process",
    "rt",
    "signal",
    "sync",
    "time",
] }
zbus_systemd = { version = "0.26000.0", optional = true, features = [
    "systemd1",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-journald = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }
logind-zbus = { version = "5.3.2", optional = true }

[features]
systemd = ["dep:zbus_systemd", "dep:tracing-journald"]
logind = ["systemd", "logind-zbus"]
default = ["logind"]
autostart = ["dep:shell-words", "dep:dirs", "dep:freedesktop-desktop-entry"]

# WMDE: redirect standard D-Bus binding crates to the local wmde-dbus-settings-bindings
# fork (source-purity; these bind standard freedesktop/system services, identical to pop-os).
[patch."https://github.com/pop-os/dbus-settings-bindings"]
cosmic-dbus-a11y = { path = "../wmde-dbus-settings-bindings/a11y" }

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
