# Один конфиг nFPM на оба формата. Стейджинг готовит `just package-staging`,
# версию всегда подставляет just через env WMDE_VERSION (см. Justfile).
# ВАЖНО: только ${WMDE_VERSION} без :-дефолта — nFPM раскрывает env через
# os.ExpandEnv и :- не понимает (версия молча станет 0.0.0~rc0).
name: wmde-session
arch: amd64
version: ${WMDE_VERSION}
release: 1
maintainer: WMDE <wmde@wmde.fun>
description: |-
  WMDE session (fork of cosmic-session)
  Launches the desktop: session binary, targets and default profile.
homepage: https://wmde.fun
license: GPL-3.0-only
section: x11

# Системное: xwayland, dirs, avahi. bash НЕ указываем: в Debian он essential
# (E lintian depends-on-essential), в rpm оставляем (там не essential).
# Пакеты WMDE — в recommends, а не depends: их пока нет в репозиториях
# дистрибутивов, а с depends пакет вообще не встанет. apt/dnf ставят
# Recommends по умолчанию, так что в сборе приедет всё. Когда выйдет
# единый репозиторий WMDE — переключить обратно в depends.
depends:
  - libc6 | glibc
  - libgcc-s1 | libgcc
  - xwayland
  - xdg-user-dirs
  - avahi-daemon | avahi

recommends:
  - wmde-comp
  - wmde-settings-daemon
  - wmde-notifications
  - wmde-panel
  - wmde-bg
  - wmde-applets
  - wmde-files
  - wmde-osd
  - wmde-start-menu
  - wmde-icons-base
  - wmde-portal
  - wmde-screenshot
  - wmde-viewer
  - wmde-greeter

suggests:
  - qt6ct
  - qt5ct

contents:
  - src: target/staging/usr/bin/wmde-session
    dst: /usr/bin/wmde-session
    file_info: { mode: 0755 }
  - src: target/staging/usr/bin/start-wmde
    dst: /usr/bin/start-wmde
    file_info: { mode: 0755 }
  - src: target/staging/usr/lib/systemd/user/wmde-session.target
    dst: /usr/lib/systemd/user/wmde-session.target
    file_info: { mode: 0644 }
  - src: target/staging/usr/share/wayland-sessions/wmde.desktop
    dst: /usr/share/wayland-sessions/wmde.desktop
    file_info: { mode: 0644 }
  - src: target/staging/usr/share/applications/wmde-mimeapps.list
    dst: /usr/share/applications/wmde-mimeapps.list
    file_info: { mode: 0644 }
  - src: target/staging/usr/share/dconf/profile/wmde
    dst: /usr/share/dconf/profile/wmde
    file_info: { mode: 0644 }
  # doc (copyright + changelog.Debian.gz) готовит just package-doc.
  # Только для deb: в rpm нет %doc-разметки у nFPM,
  # а лицензия и changelog там и так есть (License-тег + %changelog).
  - src: target/staging/usr/share/doc/wmde-session/
    dst: /usr/share/doc/wmde-session/
    type: tree
    packager: deb

scripts:
  postinstall: packaging/postinstall.sh
  postremove: packaging/postremove.sh

# %changelog для rpm генерит just package-staging (иначе E: no-changelogname-tag).
# Путь от корня репо: nFPM резолвит его от cwd, а не от каталога конфига.
changelog: target/changelog.yaml

overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - xwayland
      - xdg-user-dirs
      - avahi-daemon
    recommends:
      - wmde-comp
      - wmde-settings-daemon
      - wmde-notifications
      - wmde-panel
      - wmde-bg
      - wmde-applets
      - wmde-files
      - wmde-osd
      - wmde-start-menu
      - wmde-icons-base
      - wmde-portal
      - wmde-screenshot
      - wmde-viewer
      - wmde-greeter
    suggests:
      - qt6ct
      - qt5ct
  rpm:
    depends:
      - bash
      - libc.so.6()(64bit)
      - libgcc_s.so.1()(64bit)
      # xwayland: Fedora xorg-x11-server-Xwayland, openSUSE xwayland.
      - (xorg-x11-server-Xwayland or xwayland)
      - xdg-user-dirs
      - avahi
    recommends:
      - wmde-comp
      - wmde-settings-daemon
      - wmde-notifications
      - wmde-panel
      - wmde-bg
      - wmde-applets
      - wmde-files
      - wmde-osd
      - wmde-start-menu
      - wmde-icons-base
      - wmde-portal
      - wmde-screenshot
      - wmde-viewer
      - wmde-greeter
    suggests:
      - qt6ct
      - qt5ct
